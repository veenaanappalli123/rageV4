<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG V4 Lab</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f3f5f9}body{max-width:980px;margin:28px auto;padding:0 18px}header,section,.hit{background:#fff;border:1px solid #dce2eb;border-radius:12px;padding:18px;margin:14px 0}h1{margin:0 0 4px}p,.muted{color:#5c687b}label{display:inline-flex;gap:6px;align-items:center;margin:8px 14px 8px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #cbd3df;border-radius:7px}textarea{box-sizing:border-box;width:100%;min-height:100px}button{background:#2457b8;color:#fff;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f8fb;padding:12px;border-radius:8px}.hit{margin:10px 0;padding:14px}.score{font-size:12px;color:#536176}
</style></head><body>
<header><h1>RAG V4 Lab</h1><p class="muted">Query expansion · hybrid retrieval · local reranking · confidence-aware answers · validated citations</p><p><a href="/rag">Open V3 lab</a></p></header>
<section><label>Corpus <select id="corpus"><option value="kestrel">kestrel</option><option value="personal">personal</option></select></label><label>Top results <input id="k" type="number" min="1" max="20" value="5" style="width:65px"></label><label>Confidence threshold <input id="threshold" type="number" min="0" max="1" step="0.01" value="0.16" style="width:85px"></label><div><label><input id="dense" type="checkbox" checked> Dense</label><label><input id="bm25" type="checkbox" checked> BM25</label><label><input id="graph" type="checkbox"> Concept graph (Kestrel)</label><label><input id="generate" type="checkbox"> Generate grounded answer</label></div><textarea id="question" placeholder="Ask a question about the selected corpus..."></textarea><p><button id="ask">Retrieve & answer</button> <span id="status" class="muted"></span></p></section>
<section id="confidence" hidden></section><section id="answer" hidden><h2>Answer</h2><div id="answerText"></div><div id="citations"></div></section><section id="results" hidden><h2>Reranked evidence</h2><div id="hits"></div></section>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('ask').onclick=async()=>{const question=$('question').value.trim();if(!question){$('status').textContent='Enter a question first.';return;}$('ask').disabled=true;$('status').textContent='Searching…';$('answer').hidden=true;$('results').hidden=true;$('confidence').hidden=true;try{const response=await fetch('/api/rag/v4/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({corpus:$('corpus').value,question,k:Number($('k').value),threshold:Number($('threshold').value),dense:$('dense').checked,bm25:$('bm25').checked,graph:$('graph').checked,generate:$('generate').checked})});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');$('confidence').hidden=false;$('confidence').innerHTML=`<h2>Retrieval confidence: ${data.confidence.confident?'sufficient':'low'}</h2><p>Score ${data.confidence.score} · threshold ${data.confidence.threshold} · ${esc(data.confidence.reason)}</p><p>Expanded queries: ${data.query_variants.map(esc).join(' · ')}</p>`;$('results').hidden=false;$('hits').innerHTML=data.retrieved.map((h,i)=>`<article class="hit"><b>${i+1}. ${esc(h.source)}</b><div class="score">${esc(h.id)} · rerank score ${h.rerank_score} · ${esc((h.retrievers||[]).join(', '))}</div><pre>${esc(h.text)}</pre></article>`).join('')||'<p>No evidence retrieved.</p>';if(data.answer){$('answer').hidden=false;$('answerText').textContent=data.answer.answer;$('citations').innerHTML='<p>Validated citations: '+(data.answer.citations||[]).map(esc).join(', ')+'</p>'+(data.answer.rejected_citations?.length?'<p>Rejected unsupported citation IDs: '+data.answer.rejected_citations.map(esc).join(', ')+'</p>':'');}$('status').textContent='Done.';}catch(e){$('status').textContent=e.message;}finally{$('ask').disabled=false;}};
</script></body></html>
